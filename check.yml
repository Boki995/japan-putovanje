name: Dnevna provera cena

on:
  schedule:
    - cron: "30 5 * * *"   # svaki dan u 05:30 UTC (07:30 po našem vremenu leti)
  workflow_dispatch: {}    # ručno pokretanje: Actions → Dnevna provera cena → Run workflow

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Proveri cene
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRICE_IS_TOTAL: ${{ vars.PRICE_IS_TOTAL || 'true' }}
        run: python scripts/check_prices.py
      - name: Sačuvaj rezultate
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Cene $(date -u +%F)"
          git push
